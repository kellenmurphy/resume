profile: >-
  Identity Architect and IAM subject matter expert with over a decade of
  experience designing and operating enterprise-grade identity infrastructure
  for higher education and beyond. Currently focused on the strategic and
  technical evolution of identity services at the University of Virginia —
  from Shibboleth and Grouper operations to privileged access management and
  OIDC/SAML integrations. Equally comfortable shaping long-term identity
  strategy and diving deep into complex federation and integration challenges.

